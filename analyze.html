<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>analyze</title></head>
<body>
<script type="importmap">{ "imports": { "three": "./assets/vendor/three/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './assets/vendor/three/loaders/GLTFLoader.js';

new GLTFLoader().load('./assets/models/gba.glb', (g) => {
  const root = g.scene;
  root.updateMatrixWorld(true);
  const mesh = root.getObjectByProperty('isMesh', true);
  const pos = mesh.geometry.attributes.position;
  const v = new THREE.Vector3();
  const pts = [];
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
    pts.push([v.x, v.y, v.z]);
  }
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]), zs = pts.map(p=>p[2]);
  const ext = {
    x: Math.max(...xs) - Math.min(...xs),
    y: Math.max(...ys) - Math.min(...ys),
    z: Math.max(...zs) - Math.min(...zs)
  };
  // length = largest, height = mid, depth = smallest
  const axes = ['x','y','z'].sort((a,b)=>ext[b]-ext[a]);
  const L = axes[0], H = axes[1], D = axes[2];
  const idx = {x:0,y:1,z:2};
  const li = idx[L], hi = idx[H], di = idx[D];
  window.__axes = {L,H,D,ext};
  // grid heightmap on (L,H), value = max depth
  const N = 140, M = 90;
  const minL = Math.min(...pts.map(p=>p[li])), maxL = Math.max(...pts.map(p=>p[li]));
  const minH = Math.min(...pts.map(p=>p[hi])), maxH = Math.max(...pts.map(p=>p[hi]));
  const grid = new Array(N*M).fill(-Infinity);
  for (const p of pts) {
    const gi = Math.min(N-1, Math.floor((p[li]-minL)/(maxL-minL)*N));
    const gj = Math.min(M-1, Math.floor((p[hi]-minH)/(maxH-minH)*M));
    grid[gj*N+gi] = Math.max(grid[gj*N+gi], p[di]);
  }
  // peaks: cells whose depth exceeds (95th percentile depth - margin) and are local maxima in 5x5
  const sorted = grid.filter(x=>x>-Infinity).sort((a,b)=>a-b);
  const base = sorted[Math.floor(sorted.length*0.6)];
  const peaks = [];
  const cellW = (maxL-minL)/N, cellH = (maxH-minH)/M;
  for (let gj=2; gj<M-2; gj++) for (let gi=2; gi<N-2; gi++) {
    const val = grid[gj*N+gi];
    if (val === -Infinity || val < base + 0.008) continue;
    let isMax = true;
    for (let dj=-3; dj<=3 && isMax; dj++) for (let di2=-3; di2<=3; di2++) {
      const v2 = grid[(gj+dj)*N+gi+di2];
      if (v2 > val) { isMax = false; break; }
    }
    if (isMax) peaks.push({
      L: +(minL + (gi+0.5)*cellW).toFixed(4),
      H: +(minH + (gj+0.5)*cellH).toFixed(4),
      depth: +val.toFixed(4),
      u: +((gi+0.5)/N).toFixed(3), v: +((gj+0.5)/M).toFixed(3)
    });
  }
  window.__result = JSON.stringify({axesOrder:{L,H,D}, ext, minL,maxL,minH,maxH, peaks});
  document.title = 'ANALYZE_DONE';
});
</script></body></html>
