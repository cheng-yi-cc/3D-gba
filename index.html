<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D GBA · 博物馆展厅 (塞尔达限定版)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ede8df; }
  #app { width: 100%; height: 100%; touch-action: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(88, 70, 48, 0.18) 100%);
  }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.72); backdrop-filter: blur(8px);
    padding: 7px 16px; border-radius: 999px;
    font: 500 12.5px/1.4 system-ui, "Segoe UI", sans-serif; color: #5a5348;
    box-shadow: 0 2px 12px rgba(60,50,30,.08); pointer-events: none;
    max-width: 92vw; text-align: center;
  }
  #toolbar {
    position: fixed; left: 14px; bottom: 14px; display: flex; gap: 8px;
    align-items: center; z-index: 20;
  }
  #toolbar button {
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(90,80,60,.18); border-radius: 999px;
    padding: 7px 14px; font: 600 12px/1 system-ui, "Segoe UI", sans-serif;
    color: #4c463c; cursor: pointer;
    box-shadow: 0 2px 10px rgba(60,50,30,.10);
    transition: all .2s ease;
  }
  #toolbar button:hover { background: #fff; transform: translateY(-1px); }
  #toolbar button:active { transform: translateY(1px); }
  #toolbar button.btn-highlight {
    background: #342e26; color: #fdfbf7; border-color: #24201a;
    box-shadow: 0 2px 12px rgba(52, 46, 38, 0.28);
  }
  #toolbar button.btn-highlight:hover {
    background: #473f34;
  }
  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute; bottom: calc(100% + 10px); left: 0;
    width: 250px; background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(90, 80, 60, 0.18);
    border-radius: 14px;
    box-shadow: 0 10px 28px rgba(60, 50, 30, 0.16);
    padding: 6px; display: none; flex-direction: column; gap: 3px;
    z-index: 30;
    animation: fadeInMenu .18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .dropdown-menu.show { display: flex; }
  @keyframes fadeInMenu {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .game-item {
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
    transition: background .15s ease;
    text-align: left;
  }
  .game-item:hover {
    background: rgba(90, 80, 60, 0.08);
  }
  .game-item-title {
    font: 700 12.5px/1.3 system-ui, "Segoe UI", sans-serif;
    color: #2e2a24;
  }
  .game-item-desc {
    font: 400 11px/1.2 system-ui, sans-serif;
    color: #7d7467; margin-top: 2px;
  }
  #flash {
    position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%) translateY(8px);
    background: rgba(40,36,30,.85); color: #f4efe4;
    padding: 8px 18px; border-radius: 999px;
    font: 500 12.5px/1.4 system-ui, sans-serif;
    opacity: 0; transition: all .25s ease; pointer-events: none;
  }
  #flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #credit {
    position: fixed; bottom: 10px; right: 14px;
    font: 400 10.5px/1.4 system-ui, sans-serif; color: #9a917f;
    pointer-events: none;
  }
  #ejs-mount {
    position: fixed; left: -12000px; top: 0;
    width: 480px; height: 320px;
  }
  /* 快捷键速查面板 */
  #cheatSheet {
    position: fixed; top: 14px; right: 14px;
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px);
    border: 1px solid rgba(90, 80, 60, 0.18);
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(60, 50, 30, 0.10);
    padding: 10px 14px;
    z-index: 25;
    user-select: none;
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    min-width: 178px;
  }
  #cheatSheet.collapsed {
    min-width: unset;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.88);
  }
  #cheatSheet.collapsed:hover {
    background: #ffffff;
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(60, 50, 30, 0.14);
  }
  .cs-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 8px;
  }
  #cheatSheet.collapsed .cs-header {
    margin-bottom: 0;
  }
  .cs-title {
    font: 700 12px/1 system-ui, "Segoe UI", sans-serif;
    color: #4a4338;
    display: flex; align-items: center; gap: 5px;
  }
  .cs-toggle {
    background: rgba(90, 80, 60, 0.08); border: none; border-radius: 6px;
    width: 20px; height: 20px; font-size: 13px; font-weight: 700; line-height: 1;
    color: #6d6455; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .cs-toggle:hover {
    background: rgba(90, 80, 60, 0.16); color: #2e2a24;
  }
  .cs-body {
    display: flex; flex-direction: column; gap: 6px;
  }
  #cheatSheet.collapsed .cs-body {
    display: none;
  }
  .cs-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; font-size: 11.5px;
  }
  .cs-label {
    color: #847a6d; font-weight: 600; font-size: 11px;
    min-width: 28px;
  }
  .cs-keys {
    display: flex; align-items: center; gap: 4px;
  }
  .cs-key-group {
    display: inline-flex; align-items: center; gap: 3px;
  }
  .cs-note {
    font-size: 9.5px; font-weight: 700; color: #9c9284;
  }
  kbd {
    display: inline-block;
    background: linear-gradient(to bottom, #ffffff, #ece7df);
    border: 1px solid #c8c0b3;
    border-bottom: 2px solid #a89f90;
    border-radius: 4px;
    padding: 2px 5px;
    font: 700 10.5px/1.1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #383228;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    text-align: center; min-width: 11px;
    transition: all 0.07s ease;
  }
  kbd.active {
    transform: translateY(1px);
    background: #6a5aa1;
    border-color: #534483;
    border-bottom: 1px solid #3d3066;
    color: #ffffff;
    box-shadow: 0 0 6px rgba(106, 90, 161, 0.5);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="hud">点击右侧卡带插入游玩 · 亦可拖入本地 .gba · 键盘快捷键见右上角 · 亦可点击 3D 实体按键</div>
<div id="cheatSheet">
  <div class="cs-header">
    <span class="cs-title">⌨️ 快捷键速查</span>
    <button id="csToggle" class="cs-toggle" title="折叠快捷键">−</button>
  </div>
  <div class="cs-body" id="csBody">
    <div class="cs-row">
      <span class="cs-label">移动</span>
      <div class="cs-keys">
        <kbd class="kbd-up">W</kbd>
        <kbd class="kbd-left">A</kbd>
        <kbd class="kbd-down">S</kbd>
        <kbd class="kbd-right">D</kbd>
      </div>
    </div>
    <div class="cs-row">
      <span class="cs-label">动作</span>
      <div class="cs-keys">
        <span class="cs-key-group"><kbd class="kbd-a">J</kbd><span class="cs-note">A</span></span>
        <span class="cs-key-group"><kbd class="kbd-b">K</kbd><span class="cs-note">B</span></span>
      </div>
    </div>
    <div class="cs-row">
      <span class="cs-label">肩键</span>
      <div class="cs-keys">
        <span class="cs-key-group"><kbd class="kbd-l">U</kbd><span class="cs-note">L</span></span>
        <span class="cs-key-group"><kbd class="kbd-r">I</kbd><span class="cs-note">R</span></span>
      </div>
    </div>
    <div class="cs-row">
      <span class="cs-label">系统</span>
      <div class="cs-keys">
        <span class="cs-key-group"><kbd class="kbd-start">Enter</kbd><span class="cs-note">Start</span></span>
        <span class="cs-key-group"><kbd class="kbd-select">Space</kbd><span class="cs-note">Select</span></span>
      </div>
    </div>
  </div>
</div>
<div id="toolbar">
  <div class="dropdown">
    <button id="btnGames" class="btn-highlight">🎮 经典游戏 ▾</button>
    <div id="gameDropdown" class="dropdown-menu"></div>
  </div>
  <button id="btnImport">导入 ROM</button>
  <button id="btnEject">弹出卡带</button>
  <button id="btnSave">存档</button>
  <button id="btnLoad">读档</button>
</div>
<div id="flash"></div>
<div id="credit">GBA model: “Gameboy Advance - Zelda Concept” by yassineCGI (CC BY 4.0), sketchfab.com</div>
<input type="file" id="romFile" accept=".gba,.zip" style="display:none">
<div id="ejs-mount"></div>
<script type="importmap">{ "imports": { "three": "./assets/vendor/three/three.module.js" } }</script>
<script type="module" src="./assets/js/scene.js"></script>
<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
