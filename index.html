<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D GBA · 博物馆展厅 (塞尔达限定版)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ede8df; }
  #app { width: 100%; height: 100%; touch-action: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(88, 70, 48, 0.18) 100%);
  }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.72); backdrop-filter: blur(8px);
    padding: 7px 16px; border-radius: 999px;
    font: 500 12.5px/1.4 system-ui, "Segoe UI", sans-serif; color: #5a5348;
    box-shadow: 0 2px 12px rgba(60,50,30,.08); pointer-events: none;
    max-width: 92vw; text-align: center;
  }
  #toolbar {
    position: fixed; left: 14px; bottom: 14px; display: flex; gap: 8px;
    align-items: center; z-index: 20;
  }
  #toolbar button {
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(90,80,60,.18); border-radius: 999px;
    padding: 7px 14px; font: 600 12px/1 system-ui, "Segoe UI", sans-serif;
    color: #4c463c; cursor: pointer;
    box-shadow: 0 2px 10px rgba(60,50,30,.10);
    transition: all .2s ease;
  }
  #toolbar button:hover { background: #fff; transform: translateY(-1px); }
  #toolbar button:active { transform: translateY(1px); }
  #toolbar button.btn-highlight {
    background: #342e26; color: #fdfbf7; border-color: #24201a;
    box-shadow: 0 2px 12px rgba(52, 46, 38, 0.28);
  }
  #toolbar button.btn-highlight:hover {
    background: #473f34;
  }
  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute; bottom: calc(100% + 10px); left: 0;
    width: 250px; background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(90, 80, 60, 0.18);
    border-radius: 14px;
    box-shadow: 0 10px 28px rgba(60, 50, 30, 0.16);
    padding: 6px; display: none; flex-direction: column; gap: 3px;
    z-index: 30;
    animation: fadeInMenu .18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .dropdown-menu.show { display: flex; }
  @keyframes fadeInMenu {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .game-item {
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
    transition: background .15s ease;
    text-align: left;
  }
  .game-item:hover {
    background: rgba(90, 80, 60, 0.08);
  }
  .game-item-title {
    font: 700 12.5px/1.3 system-ui, "Segoe UI", sans-serif;
    color: #2e2a24;
  }
  .game-item-desc {
    font: 400 11px/1.2 system-ui, sans-serif;
    color: #7d7467; margin-top: 2px;
  }
  #flash {
    position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%) translateY(8px);
    background: rgba(40,36,30,.85); color: #f4efe4;
    padding: 8px 18px; border-radius: 999px;
    font: 500 12.5px/1.4 system-ui, sans-serif;
    opacity: 0; transition: all .25s ease; pointer-events: none;
  }
  #flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #credit {
    position: fixed; bottom: 10px; right: 14px;
    font: 400 10.5px/1.4 system-ui, sans-serif; color: #9a917f;
    pointer-events: none;
  }
  #ejs-mount {
    position: fixed; left: -12000px; top: 0;
    width: 480px; height: 320px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="hud">点击右侧卡带插入游玩 · 亦可拖入本地 .gba · 十字键(或WASD) / Z(A) X(B) Q(L) E(R) V(Select) Enter(Start) · 亦可点击 3D 实体按键</div>
<div id="toolbar">
  <div class="dropdown">
    <button id="btnGames" class="btn-highlight">🎮 经典游戏 ▾</button>
    <div id="gameDropdown" class="dropdown-menu"></div>
  </div>
  <button id="btnImport">导入 ROM</button>
  <button id="btnEject">弹出卡带</button>
  <button id="btnSave">存档</button>
  <button id="btnLoad">读档</button>
</div>
<div id="flash"></div>
<div id="credit">GBA model: “Gameboy Advance - Zelda Concept” by yassineCGI (CC BY 4.0), sketchfab.com</div>
<input type="file" id="romFile" accept=".gba,.zip" style="display:none">
<div id="ejs-mount"></div>
<script type="importmap">{ "imports": { "three": "./assets/vendor/three/three.module.js" } }</script>
<script type="module" src="./assets/js/scene.js"></script>
<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
