<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型对比预览</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ece7de;font-family:system-ui}
  #app{width:100%;height:100%}
  #tag{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#ffffffcc;padding:6px 14px;border-radius:8px;font-size:13px;color:#444}
</style>
</head>
<body>
<div id="app"></div>
<div id="tag">左：Zelda Concept（合并没有按键分件） 右：学生模型（7个分件）</div>
<script type="importmap">
{ "imports": { "three": "./assets/vendor/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './assets/vendor/three/controls/OrbitControls.js';
import { GLTFLoader } from './assets/vendor/three/loaders/GLTFLoader.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ece7de');

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 60);
camera.position.set(0, 0.55, 1.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.05, 0);

scene.add(new THREE.HemisphereLight('#fffaf2', '#b9b2a6', 1.1));
const key = new THREE.DirectionalLight('#fff6e8', 2.2);
key.position.set(2.2, 3.2, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2.5; key.shadow.camera.right = 2.5;
key.shadow.camera.top = 2.5; key.shadow.camera.bottom = -2.5;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
const fill = new THREE.DirectionalLight('#dfe8f2', 0.7);
fill.position.set(-2.5, 1.4, 1.8);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

function label(text){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffffdd';
  g.beginPath(); g.roundRect(6, 24, 500, 80, 18); g.fill();
  g.fillStyle = '#333';
  g.font = '600 44px system-ui';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(0.42, 0.105, 1);
  return sp;
}

const loader = new GLTFLoader();
function place(url, x, name){
  loader.load(url, (g) => {
    const root = g.scene;
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const s = 0.9 / Math.max(size.x, size.y, size.z);
    root.scale.setScalar(s);
    box.setFromObject(root);
    const cx = box.getCenter(new THREE.Vector3());
    root.position.sub(new THREE.Vector3(cx.x, box.min.y, cx.z));
    root.position.x += x;
    root.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    scene.add(root);
    const l = label(name);
    l.position.set(x, 0.62, 0);
    scene.add(l);
  });
}

place('./assets/models/gba.glb', -0.55, 'A · Zelda Concept (24MB 4K)');
place('./assets/models/std_gba.glb', 0.55, 'B · Student (7 parts)');

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
